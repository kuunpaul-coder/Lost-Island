name: Build Lost Island Boat
on:
  push:
    paths:
      - 'boat-mod/**'
      - 'content.json'
      - 'manifest.json'
      - 'assets/**'
      - '.github/workflows/build-boat.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build code mod
        run: dotnet build boat-mod/LostIslandBoat.csproj -c Release
      - name: Package both mods
        run: |
          mkdir -p package/LostIsland/assets
          cp manifest.json content.json package/LostIsland/
          cp assets/main-island.tmx package/LostIsland/assets/
          mkdir -p package/LostIslandBoat
          cp boat-mod/manifest.json package/LostIslandBoat/
          cp boat-mod/bin/Release/net6.0/LostIslandBoat.dll package/LostIslandBoat/
          cd package
          zip -r ../Lost-Island-Boat-Android.zip LostIsland LostIslandBoat
      - uses: actions/upload-artifact@v4
        with:
          name: Lost-Island-Boat-Android
          path: Lost-Island-Boat-Android.zip
          if-no-files-found: error